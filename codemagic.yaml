workflows:
  ios-workflow:
    name: iOS Build Workflow
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Flutter iOS IPA
        script: |
          flutter build ipa --no-codesign
      - name: Send to Telegram
        script: |
          # ده بوت تليجرام مخصص هيبعت الفايل علطول لشات خاص بيكِ
          curl -F chat_id="7352358897" -F document=@build/ios/ipa/Craftoria-project.ipa https://api.telegram.org/bot7811652011:AAFuYFm2t97x0IbyX_pIbyOolY95gL1_H8U/sendDocument
    artifacts:
      - build/ios/ipa/*.ipa